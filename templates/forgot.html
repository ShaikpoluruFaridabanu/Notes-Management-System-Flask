{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h4 class="mb-3">Reset password</h4>
    <form method="post">
      <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Registered email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">New password</label><input type="password" name="new_password" class="form-control" required></div>
      <button class="btn btn-primary w-100">Update password</button>
    </form>
    <p class="mt-3 mb-0 text-center"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div></div>
</div></div>
{% endblock %}
